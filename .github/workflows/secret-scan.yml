# Secret scan of the whole git history with gitleaks on every push and pull request (rules in .gitleaks.toml).
# A separate workflow on purpose: it runs on every branch and cannot touch images or deploys. GitHub's own secret
# scanning and push protection stay on as well.
name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --no-banner --redact -v
