# Secret scanning (gitleaks, run by CI on every push and by .githooks/pre-commit). Default rules plus a narrow allowlist
# for values that are public or obviously fake. Add a line here only after checking that the value is not a real secret;
# never allow a whole folder.
title = "Software Inventory gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Public demo key and fake test values"
# e2e/global-setup.ts holds the Supabase CLI's local demo anon key (iss: supabase-demo, role: anon): the same public value on every local stack.
paths = ['''^e2e/global-setup\.ts$''']
# Fake values in unit tests: sequences such as 0123456789 or 123456 do not occur in real keys.
regexes = ['''0123456789''', '''re_secret_key_123456''', '''(?i)^(wrong|bad|fake|test|mock)[-_a-z0-9]*$''']
