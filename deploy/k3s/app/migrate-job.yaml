# Applies new supabase/migrations before each rollout (Argo CD PreSync hook; recreated on every sync).
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: inventory
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/loardracoon/software-inventory-client-migrate:4bafd9ddf1324c62988d1f8bfc3e550ce824c980
          imagePullPolicy: IfNotPresent
          env:
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: supabase, key: FUNCTIONS_DB_URL } } }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
