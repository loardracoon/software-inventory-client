# Gateway of one app (Service "kong", port 8000, so database jobs keep calling http://kong:8000/functions/v1/...):
# the built front end plus the Supabase APIs on the same host, and Mailpit (magic links) behind basic auth.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 8000;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 10m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

  location /auth/v1/ {
    proxy_pass http://auth:9999/;
  }

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
  }

  location /functions/v1/ {
    proxy_pass http://functions:9000/;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }

  location /mail/ {
    auth_basic "Mail";
    auth_basic_user_file /etc/nginx/auth/htpasswd;
    proxy_pass http://mailpit:8025;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
